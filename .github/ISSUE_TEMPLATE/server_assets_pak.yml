name: Server assets pak
description: Contribute a server-assets pak of one build, made with ServerAssetsExtractor
title: "Server assets pak: <build> (CL-<changelist>)"
labels: ["pak"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. A pak is a full data extraction of one console build, made with [ServerAssetsExtractor](https://github.com/PongooDev/Core-ServerAssets#making-a-pak-with-the-extractor), from a console build of the same changelist as a PC build Core supports.
        Before it's published, it's checked: right changelist, made by the extractor with its default rules, and it loads on a headless server.
  - type: input
    id: build
    attributes:
      label: Fortnite version
      description: The version of the build the assets came from, as Fortnite numbers it.
      placeholder: "7.00"
    validations:
      required: true
  - type: input
    id: changelist
    attributes:
      label: Changelist of the build the assets came from
      description: From the console build's Engine/Build/Build.version (Changelist). PS4 patch numbers aren't Fortnite versions.
      placeholder: "3901517"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the assets came from
      description: PlayStation 4 builds have the server assets up to Season 12, Xbox builds in every season.
      options:
        - PlayStation 4 build
        - Xbox build
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: extractor
    attributes:
      label: Made with ServerAssetsExtractor, version
      description: 'The version it prints on its first line, 3.1.0 or later. Paks are a full data extraction made with the [extractor](https://github.com/PongooDev/Core-ServerAssets#making-a-pak-with-the-extractor), not hand-picked assets. Paks from 3.0.0 leave out the levels with built navmeshes the server needs, and paks from earlier versions carry console-cooked lighting data and textures: both have to be made again.'
      placeholder: "3.1.0"
    validations:
      required: true
  - type: textarea
    id: pak
    attributes:
      label: The pak
      description: 'Preferred: fork PongooDev/Core-ServerAssets, then on your fork choose Releases, Draft a new release, pick any tag (for example cl-<changelist>), attach the .pak and .sig (up to 2 GB per file), click Publish release (a draft can''t be downloaded) and paste the release link here. Fallback: a host with direct downloads, such as pixeldrain.com or a Dropbox link. gofile and MEGA links have to be downloaded by hand, so they may take longer to publish. GitHub issues only take attachments up to 25 MB, so a pak can''t be attached, zipped or not. Attach its contents.txt and report.txt (they''re small). Never post the AES key.'
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Did you test it?
      description: For example, what Core's server log said when you hosted with the pak in FortniteGame\Content\Paks.
  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: The assets are from the same build and changelist as above.
          required: true
        - label: The pak and sig are exactly what ServerAssetsExtractor made, with its default rules.json (nothing added, removed or repacked).
          required: true
        - label: The extractor's own check at the end passed ("Checking the pak" shows no FAIL), so the pak has no texture, mesh, material, audio, lighting or other console-cooked data.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
