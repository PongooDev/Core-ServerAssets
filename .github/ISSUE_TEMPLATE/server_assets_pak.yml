name: Server assets pak
description: Contribute a server-assets pak of one build, made with ServerAssetsExtractor
title: "Server assets pak: <build> (CL-<changelist>)"
labels: ["pak"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. A pak is a full data extraction of one console build, made with [ServerAssetsExtractor](https://github.com/PongooDev/Core-ServerAssets#making-a-pak-with-the-extractor), from a console build of the same changelist as a PC build Core supports.
        Before it's published, it's checked: right changelist, made by the extractor with its default rules, and it loads on a headless server.
  - type: dropdown
    id: build
    attributes:
      label: Fortnite build
      options:
        - 1.10 (CL-3790078)
        - 1.11 (CL-3807424)
        - 2.1 (CL-3825894)
        - 2.2 (CL-3841827)
        - 2.3 (CL-3847564)
        - 2.4 (CL-3858292)
        - 2.4.2 (CL-3870737)
        - 2.5 (CL-3889387)
        - 3.0 (CL-3901517)
        - 3.1.0 (CL-3915963)
        - 3.1.1 (CL-3917250)
        - 3.2 (CL-3935073)
        - 3.3 (CL-3942182)
        - 3.5.1 (CL-4000805)
        - 3.5.2 (CL-4008490)
        - 3.6 (CL-4019403)
        - 4.0 (CL-4039451)
        - 4.1 (CL-4053532)
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: changelist
    attributes:
      label: Changelist of the build the assets came from
      description: From the console build's Engine/Build/Build.version (Changelist). PS4 patch numbers aren't Fortnite versions.
      placeholder: "3901517"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the assets came from
      description: PlayStation 4 builds have the server assets up to Season 12, Xbox builds in every season.
      options:
        - PlayStation 4 build
        - Xbox build
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: extractor
    attributes:
      label: Made with ServerAssetsExtractor, version
      description: The version it prints on its first line, e.g. 1.0.0. Paks are a full data extraction made with the [extractor](https://github.com/PongooDev/Core-ServerAssets#making-a-pak-with-the-extractor), not hand-picked assets.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: pak
    attributes:
      label: The pak
      description: Upload the .pak and .sig the extractor made to a file host (Google Drive, MEGA, Dropbox, OneDrive or MediaFire, shared with anyone who has the link) and paste the links here. GitHub only takes attachments up to 25 MB, so a pak can't be attached, zipped or not. Attach its contents.txt and report.txt (they're small). Never post the AES key.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Did you test it?
      description: For example, what Core's server log said when you hosted with the pak in FortniteGame\Content\Paks.
  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: The assets are from the same build and changelist as above.
          required: true
        - label: The pak and sig are exactly what ServerAssetsExtractor made, with its default rules.json (nothing added, removed or repacked).
          required: true
        - label: The extractor's own check at the end passed ("Checking the pak" shows no FAIL).
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
